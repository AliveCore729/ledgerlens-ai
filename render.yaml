databases:
  - name: ledgerlens-db
    databaseName: ledgerlens
    user: ledgerlens_user
    plan: free

services:
  # Managed Redis Cache / Queue
  - type: redis
    name: ledgerlens-redis
    plan: free
    ipAllowList: [] # Keep internal

  # The NestJS Backend API
  - type: web
    name: ledgerlens-api
    plan: free
    env: node
    buildCommand: pnpm install && pnpm run build --filter=api
    startCommand: cd apps/api && pnpm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerlens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ledgerlens-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # The Background OCR Worker
  # Note: Render doesn't allow free workers. We are configuring this as a web service 
  # that binds to a dummy port so it qualifies for the free tier.
  - type: web
    name: ledgerlens-ocr-worker
    plan: free
    env: node
    buildCommand: pnpm install && cd services/ocr && pnpm run build
    startCommand: PORT=10000 cd services/ocr && pnpm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerlens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ledgerlens-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
