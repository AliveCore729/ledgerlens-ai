
services:
  db:
    image: postgres:15-alpine
    container_name: ledgerlens-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ledgerlens-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledgerlens-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ledgerlens-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ledgerlens-api
    restart: always
    # Port is internal only — Nginx proxies /api/* to this service
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ledgerlens}?schema=public
      - REDIS_URL=redis://redis:6379

    networks:
      - ledgerlens-net

  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: ledgerlens-ocr-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ledgerlens}?schema=public
      - REDIS_URL=redis://redis:6379

    networks:
      - ledgerlens-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # Domain is now https://shreyanshjain.site — set in .env.production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: ledgerlens-web
    restart: always
    # Port is internal only — Nginx proxies / to this service
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - ledgerlens-net

  nginx:
    image: nginx:alpine
    container_name: ledgerlens-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certs provisioned by certbot on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - ledgerlens-net

networks:
  ledgerlens-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
