events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server web:3000;
    }

    upstream backend {
        server api:4000;
    }

    # -----------------------------------------------
    # HTTP — redirect all traffic to HTTPS
    # -----------------------------------------------
    server {
        listen 80;
        server_name shreyanshjain.site;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------
    # HTTPS — main server with SSL
    # -----------------------------------------------
    server {
        listen 443 ssl;
        server_name shreyanshjain.site;

        # Let's Encrypt certificates (mounted from host)
        ssl_certificate     /etc/letsencrypt/live/shreyanshjain.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shreyanshjain.site/privkey.pem;

        # Modern SSL settings
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # -----------------------------------------------
        # API — route /api/* to NestJS backend
        # -----------------------------------------------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Allow large file uploads (PDF/images for OCR)
            client_max_body_size 50M;
        }

        # -----------------------------------------------
        # Frontend — route everything else to Next.js
        # -----------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
